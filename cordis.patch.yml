# dsh-miloco-bridge — bundle patch layer.
#
# 两半架构：
#
#   1. dsh-miloco-bridge —— 全局 infra 半边。负责：
#        - POST /miloco/webhook         Miloco 主动推送的落点
#        - /dsh-miloco-bridge/api/*     Web 设置页数据与写入
#        - 一键部署 / 连接已有 Miloco
#      这些能力必须全局常驻，与当前使用哪个 Agent 无关。
#
#   2. dsh-miloco-bridge/tools —— 只挂在专用 Agent 预设「miloco」里。
#      设备/感知/规则/任务/身份/档案/通知等工具与全部技能都只属于这个预设，
#      普通会话看不到任何 miloco_* 工具，也不会被注入 miloco 技能。
#
# 推送目标的运行时选择（会话 / 模型）写在 ~/.dsh/miloco-plugin.json；
# 连接信息（baseUrl / token）也写在这里，因此「连接已有 Miloco」立即生效，
# 不必重启 DSH。
- insert:
    - id: dsh-miloco-bridge
      name: 'dsh-miloco-bridge'
      config:
        # 默认只读：写工具根本不注册，模型看不到也不会误触真实设备。
        readOnly: true
        # 留空 = 自动读取 $MILOCO_HOME/config.json 的 server.url / server.token。
        baseUrl: ""
        token: ""
        home: "~/.miloco"
        timeoutMs: 30000
        # 留空 = $DSH_HOME/miloco-plugin.json / $DSH_HOME/miloco-plugin.state.json
        overlayFile: ""
        stateFile: ""
        # 可选：写 profile patch 的绝对路径；留空则只写运行时 overlay。
        profilePatch: ""
        push:
          enabled: true
          path: "/miloco/webhook"
          # 留空 = 回退到运行时 overlay 里的 push.token；两者都空则拒绝所有入站请求。
          token: ""
          waitForResult: true
          target:
            # 空 = 投到「上一次触发 miloco 的会话」。
            sessionId: ""
            # 新建推送会话时使用的 Agent 预设。
            agentPreset: "miloco"
          model:
            # 空 = 跟随目标对话自己选的模型；provider+model 都填才覆盖。
            provider: ""
            model: ""
            reasoningEffort: ""
          perception:
            # all / low / medium / high：低于该等级的感知建议不投递到 DSH。
            # 规则、任务、onboarding、普通对话事件不带 urgency，始终放行。
            minLevel: "all"
        deploy:
          repo: "https://github.com/XiaoMi/xiaomi-miloco"
          # 一键部署下载官方 release install.sh，不再 clone 源码。
          # 留空 = $DSH_HOME/plugin-data/dsh-miloco-bridge/xiaomi-miloco
          # （release 部署不创建该目录；仅保留给旧源码部署/卸载清理）
          sourceDir: ""
          # --skip-openclaw 阻止上游安装 OpenClaw 插件；--agent-platform=openclaw
          # 只用于通过上游非交互式平台检测，实际由 DSH adapter 接管。
          installArgs: ["--skip-openclaw", "--agent-platform=openclaw", "--lang=zh"]
          # 直连 GitHub 失败时按顺序尝试这些镜像（直接拼接原 URL）。
          githubMirrors:
            - "https://gh-proxy.com/"
            - "https://gh-proxy.org/"
          # release 包默认从第一个镜像下载；留空 = 自动拼接 releases/download。
          downloadSite: ""
          # 额外的 uv 索引，不覆盖用户默认索引；PyPI 带 upload-time 元数据，
          # 部分国内镜像缺少该元数据会触发安装器 exclude-newer 解析失败。
          uvIndex: "https://pypi.org/simple"
        # 设置页里不展示任何「DSH 默认模型」配置项。模型下拉只有
        # 「跟随该对话」+ 实际模型；不选模型就完全不动会话的模型选择。
    # ------------------------------------------------------------------
    # 专用 Agent 预设：只有选了它的会话才拿到米家工具与技能。
    # ------------------------------------------------------------------
    - id: preset-miloco
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: miloco
        name: Miloco 家庭助手
        description: >-
          家里的全屋智能管家：米家工具与技能隔离在这个预设中，能看设备、问摄像头、查档案与用量。
        order: 30
        plugins:
          - id: dsh-miloco-bridge-tools
            name: 'dsh-miloco-bridge/tools'
            config:
              readOnly: true
              baseUrl: ""
              token: ""
              home: "~/.miloco"
              timeoutMs: 30000
              # 留空 = $DSH_HOME 下的运行时文件，与全局半边共用
              overlayFile: ""
              stateFile: ""
              cwd: ""
          # 保留标准 DSH Agent 的工具面；子插件只在 miloco 预设内生效。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
